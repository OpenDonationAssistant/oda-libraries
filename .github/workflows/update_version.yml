# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Update service version in specifications

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k3s specs
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          repository: "OpenDonationAssistant/oda-k3s-specs"
          path: "scripts"

      - name: Update version
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          file="scripts/apps/${SERVICE}/deployment.yaml.j2"
          sed -i -E "s#(ghcr\.io/opendonationassistant/oda-${SERVICE}:)[^\"[:space:]]+#\1${VERSION}#" "$file"
          if ! grep -qE "ghcr\.io/opendonationassistant/oda-${SERVICE}:${VERSION}([\"[:space:]]|$)" "$file"; then
            echo "::error::Failed to update image tag for ${SERVICE} in ${file}"
            exit 1
          fi

      - name: Commit & Push changes
        run: |
          cd scripts
          git config --global user.email "stcarolas@gmail.com"
          git config --global user.name "stCarolas"
          git commit -am "up ${{ inputs.service }} version to ${{ inputs.version }}"
          git remote set-url origin https://${{ secrets.PUSH_TOKEN }}@github.com/OpenDonationAssistant/oda-k3s-specs
          git push
