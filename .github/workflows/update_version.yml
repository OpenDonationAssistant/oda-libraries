# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Update service version in specifications

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k3s specs
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_TOKEN }}
          repository: "OpenDonationAssistant/oda-k3s-specs"
          path: "scripts"

      - name: Update version
        env:
          SERVICE: ${{ inputs.service }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "${VERSION}" ]]; then
            echo "::error::version input is empty"
            exit 1
          fi

          file="scripts/inventory/local/group_vars/k3s/${SERVICE}.yml"
          if [[ ! -f "$file" ]]; then
            echo "::error::Inventory file not found: $file"
            exit 1
          fi

          key="${SERVICE//-/_}"
          yq -i ".${key}.version = env(VERSION)" "$file"

          actual="$(yq ".${key}.version" "$file")"
          if [[ "$actual" != "$VERSION" ]]; then
            echo "::error::Failed to update ${SERVICE} in ${file} (expected '${VERSION}', got '${actual}')"
            exit 1
          fi

      - name: Commit & Push changes
        run: |
          cd scripts
          git config --global user.email "stcarolas@gmail.com"
          git config --global user.name "stCarolas"
          git commit -am "up ${{ inputs.service }} version to ${{ inputs.version }}"
          git remote set-url origin https://${{ secrets.PUSH_TOKEN }}@github.com/OpenDonationAssistant/oda-k3s-specs
          git push
